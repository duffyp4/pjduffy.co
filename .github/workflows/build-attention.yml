name: Build Attention Page

on:
  # Event-driven: triggered by worker or Apps Script
  repository_dispatch:
    types: [rebuild-attention-page]
  # Daily safety net
  schedule:
    - cron: '0 12 * * *'  # Noon UTC (8am ET)
  # Manual trigger
  workflow_dispatch:

permissions:
  contents: write

# One build at a time. A burst of dispatches (e.g. saving several articles in a row)
# collapses into the running build plus the newest pending one, instead of parallel
# runs that race each other to push radar.html.
concurrency:
  group: build-attention-page
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Check out the branch tip at run start, not the SHA captured when the event
          # fired -- a queued run would otherwise build on a stale commit and fail to push.
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd scripts && npm install

      - name: Build attention page
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          KINDLE_WORKER_URL: ${{ secrets.KINDLE_WORKER_URL }}
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: node scripts/build-attention-page.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add radar.html
          git diff --staged --quiet || (git commit -m "Update radar page" && git push)
